spring:
  mail:
    properties:
      "[mail.smtp.auth]": ${CRM_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${CRM_SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${CRM_SMTP_STARTTLS:true}
      "[mail.smtp.ssl.enable]": ${CRM_SMTP_SSL:false}
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost}
    port: ${CASSANDRA_PORT:9042}
    keyspace-name: ${CASSANDRA_KEYSPACE_NAME:mykeyspacename}
    local-datacenter: ${CASSANDRA_LOCAL_DATACENTER:datacenter1}
    schema-action: ${CASSANDRA_SCHEMA_ACTION:NONE}
    entity-base-package: com.brewery.web.model
  mvc:
    view:
      prefix: "/WEB-INF/jsp/"
      suffix: ".jsp"
server:
  error:
    include-message: always
    include-exception: true
    include-stacktrace: always
    include-binding-errors: always
