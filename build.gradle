plugins {
    id "java"
    id "war"
}

dependencies {}

// Keep the Spring modules on the same current Jackson, cache, and test releases.
subprojects {
    ext['jackson-bom.version'] = '3.2.4'
    // Jackson 3 retains the com.fasterxml annotations shared with Jackson 2.
    ext['jackson-2-bom.version'] = '2.22.4'
    ext['caffeine.version'] = '3.3.1'
    ext['junit-jupiter.version'] = '6.1.3'
}

tasks.register("runApp") {
    dependsOn(":frontend:bootRun")
}

tasks.register("runAuth") {
    dependsOn(":auth_service:authDev")
}
