services:
  cassandra:
    image: website-chat-cassandra:local
    build:
      context: ./cassandra
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: website-chat
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh localhost 9042 -e 'SELECT release_version FROM system.local' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  cassandra-init:
    image: website-chat-cassandra:local
    restart: "no"
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra:/schema:ro
    command:
      - /bin/sh
      - -c
      - cqlsh cassandra 9042 -f /schema/project.cql && cqlsh cassandra 9042 -f /schema/crm-schema.cql

  app:
    image: website-chat-app:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_CASSANDRA_PORT: "9042"
      SPRING_CASSANDRA_KEYSPACE_NAME: mykeyspacename
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_SCHEMA_ACTION: NONE
      AUTH_SERVICE_SECRET_KEY: ${AUTH_SERVICE_SECRET_KEY:-}

  auth_service:
    image: website-chat-auth:local
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "8443:8443"
    environment:
      CRM_BACKEND_URL: http://app:8080
      AUTH_SERVICE_SECRET_KEY: ${AUTH_SERVICE_SECRET_KEY:-}

volumes:
  cassandra-data:
